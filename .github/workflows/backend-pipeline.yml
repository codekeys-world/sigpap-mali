name: Pipeline de déploiement du backend du projet SIGPAP-MALI
on:
  push:
    branches:
      - develop
      - ci
      - main
    paths:
      - ../../backend
      - documentation/**
      - ../../docker/backend
      - ../../docker-compose.yml
      - .github/workflows/backend-pipeline.yml
jobs:
  compilation:
    runs-on: ubuntu-latest
    name: Compilation du projet SIGPAP
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          clean: true

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilation du projet
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean compile

  test-unitaire:
    name: Test unitaire du projet backend de SIGPAP
    runs-on: ubuntu-latest
    env:
      ACTIVE_PROFILE: test
      DB_HOST: localhost
      DB_PORT: '3306'
      DB_NAME: test_db
      DB_USERNAME: test_user
      DB_PASSWORD: test_password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          clean: true

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Exécution des tests unitaires
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress -Dspring.profiles.active=test clean test
      - name: Rapports des tests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  build-project:
    runs-on: ubuntu-latest
    name: Build du projet backend de SIGPAP
    needs:
      - compilation
      - test-unitaire
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          clean: true

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build du projet
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

  build-image:
    runs-on: ubuntu-latest
    name: Build et push de l'image docker du backend de SIGPAP
    needs:
      - build-project
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          clean: true

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build du projet
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Extraire la version du projet
        run: |
          cd backend
          VERSION=$(./mvnw org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Connection à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sigpap-backend:${{ env.VERSION }},${{ secrets.DOCKERHUB_USERNAME }}/sigpap-backend:latest
