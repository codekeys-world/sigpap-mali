name: Pipeline de déploiement du frontend du projet SIGPAP-Mali
on:
  push:
    branches: [develop, ci, main]
    paths:
      - ../../frontend
      - documentation/**
      - ../../docker/frontend
      - ../../docker-compose.yml
      - .github/workflows/frontend-pipeline.yml

jobs:
  build-image:
    name: Build de l'image Docker du frontend de SIGPAP-MALI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: 'true'

      - name: Extract project version
        id: extract_version
        run: |
          cd frontend
          echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to Dockerhub
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: docker/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sigpap-frontend:${{ steps.extract_version.outputs.VERSION}},${{ secrets.DOCKERHUB_USERNAME }}/sigpap-frontend:latest

  deploiement:
    name: Déploiement de l'image du frontend du projet du SIGPAP-MALI
    runs-on: self-hosted
    needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: 'true'


      - name: Configuration SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519_sigpap
          chmod 600 ~/.ssh/id_ed25519_sigpap

          ssh-keyscan -H "${{ secrets.VPS_IP }}" >> ~/.ssh/known_hosts

      - name: Test connexion SSH
        run: |
          ssh -i ~/.ssh/id_ed25519_sigpap \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} \
            "echo 'Connexion SSH frontend réussie'"

      - name: Copie du fichier docker-compose et déploiement
        run: |
          SSH="ssh -i ~/.ssh/id_ed25519_sigpap -o IdentitiesOnly=yes"
          SCP="scp -i ~/.ssh/id_ed25519_sigpap -o IdentitiesOnly=yes"

          $SSH ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} \
            "mkdir -p ~/sigpap-mali"

          $SCP docker-compose.yml \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:~/sigpap-mali/docker-compose.yml

          $SSH ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << EOF
            set -e

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            cd ~/sigpap-mali

            docker compose -f docker-compose.yml pull -q
            docker compose -f docker-compose.yml up -d --force-recreate

            docker logout
          EOF
