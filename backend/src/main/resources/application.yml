server:
  port: 8080

spring:
  application:
    name: sigpap-mali
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ap_rh}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:apes}
    password: ${DB_PASSWORD:apes_password}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  auth-cookie-secure: ${AUTH_COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-at-least-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  seed-enabled: ${SEED_ENABLED:true}
  mail-from: ${MAIL_FROM:no-reply@ap.local}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  retraite:
    age-defaut: ${AGE_RETRAITE_DEFAUT:60} # à adapter selon les textes statutaires ; modifiable par corps

management:
  endpoints:
    web:
      exposure:
        include: health # /actuator/health (supervision, healthchecks Docker/Kubernetes)

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true} # http://localhost:8080/swagger-ui.html (mettre false en production)
