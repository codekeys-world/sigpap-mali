limit_req_zone $binary_remote_addr zone=public_forms:10m rate=10r/m;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location ~ ^/api/auth/(login|mot-de-passe-oublie|reinitialiser-mot-de-passe)$ {
    limit_req zone=public_forms burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @rate_limited;
    proxy_pass http://sigpap-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }
  location @rate_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    return 429 '{"status":429,"message":"Trop de demandes rapprochées. Patientez avant de réessayer."}';
  }

  location /api/ {
    proxy_pass http://sigpap-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }
  location ~* \.(js|css)$ {
    expires 1y;
    try_files $uri =404;
  }
  location ~* \.(woff2?|ttf|eot|png|jpe?g|webp|avif|svg|ico)$ {
    expires 30d;
    try_files $uri =404;
  }
  location = /index.html {
    expires -1;
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
